services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticktracker
      POSTGRES_USER: ticktracker
      POSTGRES_PASSWORD: ticktracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticktracker -d ticktracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticktracker
      DB_USER: ticktracker
      DB_PASSWORD: ticktracker
      UPLOAD_DIR: /data/uploads
      ELANCO_API_BASE_URL: ${ELANCO_API_BASE_URL:-https://dev-task.elancoapps.com/data}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
