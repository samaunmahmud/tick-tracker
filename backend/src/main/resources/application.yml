spring:
  application:
    name: tick-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticktracker}
    username: ${DB_USER:ticktracker}
    password: ${DB_PASSWORD:ticktracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  elanco:
    base-url: ${ELANCO_API_BASE_URL:https://dev-task.elancoapps.com/data}
    connect-timeout: 5s
    read-timeout: 20s
    max-attempts: 5
    initial-backoff: 5s
    max-backoff: 60s
    sync-on-startup: ${SYNC_ON_STARTUP:true}
    sync-cron: "0 0 */6 * * *"
